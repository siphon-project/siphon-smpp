# cargo-deny — dependency-graph security / license / source policy for siphon-smpp.
# Local: `cargo deny check`
# CI: bans/licenses/sources gate every PR (ci.yaml `deny` job); advisories run
#     weekly and report on an issue (audit.yml) rather than blocking a PR.
# Docs: https://embarkstudios.github.io/cargo-deny/

[graph]
targets = [
    { triple = "x86_64-unknown-linux-gnu" },
    { triple = "aarch64-unknown-linux-gnu" },
]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
    # paste — unmaintained transitive (no vuln); pulled via the pyo3 stack.
    # Remove once the parent crate drops it.
    "RUSTSEC-2024-0436",
]

[bans]
# Duplicates are a hard failure, with the ones already in the graph skipped by
# name. That way a *new* crate showing up twice fails the PR that introduced it,
# while a dependabot bump of an already-duplicated crate does not go red and
# force a deny.toml edit in the same PR. Skipping by name (not name@version) is
# what buys that: the entry survives version churn.
#
# Every entry below arrives through siphon-sip's dependency tree, not ours.
# Prune one when `cargo deny check bans` stops reporting it.
multiple-versions = "deny"
wildcards = "warn"
skip = [
    # RustCrypto's 0.10 → 0.11 trait generation. The two halves coexist because
    # the p256/ecdsa/elliptic-curve stack still pins the older `digest` line
    # while other consumers have moved on; it resolves when that stack bumps.
    { crate = "block-buffer", reason = "RustCrypto 0.10/0.11 generation split" },
    { crate = "const-oid", reason = "RustCrypto 0.10/0.11 generation split" },
    { crate = "cpufeatures", reason = "RustCrypto 0.10/0.11 generation split" },
    { crate = "crypto-common", reason = "RustCrypto 0.10/0.11 generation split" },
    { crate = "der", reason = "RustCrypto 0.10/0.11 generation split" },
    { crate = "digest", reason = "RustCrypto 0.10/0.11 generation split" },
    { crate = "hmac", reason = "RustCrypto 0.10/0.11 generation split" },
    { crate = "pem-rfc7468", reason = "RustCrypto 0.10/0.11 generation split" },
    { crate = "sha2", reason = "RustCrypto 0.10/0.11 generation split" },
    { crate = "spki", reason = "RustCrypto 0.10/0.11 generation split" },

    # rand 0.9 → 0.10, dragging three getrandom / rand_core lines with it.
    { crate = "getrandom", reason = "rand 0.9/0.10 transition" },
    { crate = "rand", reason = "rand 0.9/0.10 transition" },
    { crate = "rand_core", reason = "rand 0.9/0.10 transition" },

    # Independent major bumps that have not finished propagating.
    { crate = "base64", reason = "0.22 via reqwest/hyper-util/postgres, 0.23 direct" },
    { crate = "hashbrown", reason = "0.14 transitive, 0.17 current" },
    { crate = "linux-raw-sys", reason = "follows rustix 0.38/1.x" },
    { crate = "nom", reason = "7.x transitive, 8.x current" },
    { crate = "rustix", reason = "0.38 via prometheus/procfs, 1.x via tempfile" },
    { crate = "syn", reason = "2.x proc-macro deps, 3.x current" },
    { crate = "thiserror", reason = "1.x transitive, 2.x current" },
    { crate = "thiserror-impl", reason = "1.x transitive, 2.x current" },
    { crate = "tower-http", reason = "0.6 via reqwest, 0.7 direct" },
]
# siphon-smpp embeds CPython via PyO3 (links libpython); that C dependency is
# intentional, so there is no C-FFI ban list here.

[licenses]
# The crate is MIT; keep dependencies OSI-permissive.
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",             # public-domain dedication (transitive deps)
    "CDLA-Permissive-2.0", # webpki-roots cert bundle
    "BSL-1.0",             # Boost Software License (permissive, OSI)
]
confidence-threshold = 0.9

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# siphon-sip (the host platform) is consumed as a permanent git dependency —
# siphon-smpp is an extension, not a crates.io crate.
allow-git = ["https://github.com/siphon-project/siphon-sip"]
