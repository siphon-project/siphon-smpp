# Clippy configuration for siphon-smpp.
#
# too-many-arguments-threshold: SMPP PDU constructors and the smpp34 client/
# server builders carry many protocol fields, so the default threshold of 7
# fires on the natural shape of the protocol. Raise it to 12 (matching the
# siphon workspace) so the lint still flags genuinely-egregious signatures.
too-many-arguments-threshold = 12

# disallowed-methods: waits that park the calling thread (the same list as
# siphon-sip's). On a thread attached to the interpreter (a script API, a
# handler's continuation) any of them holds a garbage collection's
# stop-the-world open for as long as it waits, and a wait that needs tokio to
# finish never ends. Each wait goes through `siphon::script::blocking`
# (`released` / `blocking_released` / `block_on_released`, which release the
# interpreter when the thread holds it), or runs on a thread that never
# attaches. An exception is an `#[allow(clippy::disallowed_methods)]` with the
# reason beside it.
disallowed-methods = [
  { path = "tokio::runtime::Handle::block_on", reason = "parks the thread; use siphon::script::blocking::block_on_released" },
  { path = "tokio::runtime::Runtime::block_on", reason = "parks the thread; startup only" },
  { path = "tokio::task::block_in_place", reason = "use siphon::script::blocking::blocking_released" },
  { path = "std::net::ToSocketAddrs::to_socket_addrs", reason = "blocking getaddrinfo; use tokio, or wrap in blocking_released" },
  { path = "std::net::TcpStream::connect", reason = "blocking connect; use tokio, or wrap in blocking_released" },
  { path = "std::net::TcpStream::connect_timeout", reason = "blocking connect; use tokio, or wrap in blocking_released" },
  { path = "std::thread::sleep", reason = "parks the thread; tokio::time::sleep, or a dedicated thread that never attaches" },
  { path = "tokio::sync::mpsc::Receiver::blocking_recv", reason = "parks the thread; await it, or wrap in blocking_released" },
  { path = "tokio::sync::mpsc::UnboundedReceiver::blocking_recv", reason = "parks the thread; await it, or wrap in blocking_released" },
  { path = "tokio::sync::oneshot::Receiver::blocking_recv", reason = "parks the thread; await it, or wrap in blocking_released" },
]
